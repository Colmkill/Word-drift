<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Drift — Spelling Arcade</title>
<style>
  :root{
    --bg-deep:#1E1B4B; --bg-panel:#312E81; --bg-panel-light:#4338CA;
    --amber:#FBBF24; --cyan:#22D3EE; --pink:#F472B6; --mint:#34D399; --violet:#A78BFA; --gold:#FDE68A;
    --cream:#FDF4E3; --red:#F87171;
    --font-body: 'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ height:100%; height:100dvh; }
  body{
    margin:0; height:100%; height:100dvh; min-height:480px;
    font-family:'Nunito','Segoe UI',system-ui,sans-serif; background:var(--bg-deep); color:var(--cream);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(167,139,250,0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(34,211,238,0.12), transparent 40%);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{ font-family:inherit; color:inherit; border:none; cursor:pointer; }
  #app{ height:100%; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .font-display{ font-family:var(--font-body); }

  /* ============ STATUS BAR ============ */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 16px; background:var(--bg-panel); box-shadow:0 4px 18px rgba(0,0,0,.4); z-index:20; flex-wrap:wrap;
  }
  .brand{ font-size:clamp(20px,3vw,30px); color:var(--amber); font-family:var(--font-body); font-weight:800; white-space:nowrap; }
  .stats{ display:flex; align-items:center; gap:clamp(10px,2vw,24px); font-weight:700; font-size:14px; }
  .stat{ display:flex; flex-direction:column; align-items:center; min-width:44px; }
  .stat .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:rgba(253,244,227,.6); }
  .stat .val{ font-family:var(--font-body); font-size:clamp(17px,2vw,22px); line-height:1.1; transition:transform .15s ease; }
  .stat .val.bump{ transform:scale(1.35); }
  #scoreVal{color:var(--mint);} #levelVal{color:var(--cyan);} #multVal{color:var(--pink);}
  .hdr-btns{ display:flex; gap:8px; }
  .icon-btn{
    background:var(--bg-panel-light); padding:8px 12px; border-radius:12px; font-size:16px; line-height:1;
    transition:background .15s ease, transform .1s ease;
  }
  .icon-btn:hover{ background:rgba(67,56,202,.85); }
  .icon-btn:active{ transform:scale(.93); }
  .icon-btn.danger:hover{ background:rgba(239,68,68,.7); }

  /* ============ MAIN LAYOUT ============ */
  main{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  #arena{
    position:relative; flex:1; min-height:240px; overflow:hidden; touch-action:none; cursor:crosshair;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px);
  }
  #bgLayer, #fgLayer{ position:absolute; inset:0; pointer-events:none; background-repeat:no-repeat; background-size:cover; transition:background .3s ease; overflow:hidden; }
  #bgLayer{ z-index:0; }
  #fgLayer{ z-index:3; }
  #arenaHint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:0 24px; color:rgba(253,244,227,.35); font-family:var(--font-body); font-size:17px; pointer-events:none; z-index:10;
    animation:hintPulse 2.2s ease-in-out infinite;
  }
  @keyframes hintPulse{ 0%,100%{opacity:.85;} 50%{opacity:.45;} }
  .tile{
    position:absolute; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    border-radius:16px; font-family:var(--font-body); font-weight:700; font-size:24px; color:#1E1B4B;
    pointer-events:none; user-select:none; box-shadow:0 4px 0 rgba(0,0,0,0.25), 0 6px 12px rgba(0,0,0,0.25);
    transition:opacity .15s ease; will-change:transform; z-index:2;
  }
  .tile .pt{ position:absolute; bottom:3px; right:6px; font-size:9px; font-weight:800; opacity:.7; }
  .tile.premium{ box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(253,230,138,.7); animation:pulseGold 1.1s ease-in-out infinite; }
  @keyframes pulseGold{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.25);} }
  .deco{ position:absolute; pointer-events:none; user-select:none; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  @keyframes drift-right{
    0%,100%{ transform: var(--deco-rotate, rotate(0deg)) translateX(0); }
    50%{ transform: var(--deco-rotate, rotate(0deg)) translateX(var(--deco-dist, 70px)); }
  }
  @keyframes drift-left{
    0%,100%{ transform: var(--deco-rotate, rotate(0deg)) translateX(0); }
    50%{ transform: var(--deco-rotate, rotate(0deg)) translateX(calc(-1 * var(--deco-dist, 70px))); }
  }
  @keyframes drift-up{
    0%,100%{ transform: var(--deco-rotate, rotate(0deg)) translateY(0); }
    50%{ transform: var(--deco-rotate, rotate(0deg)) translateY(calc(-1 * var(--deco-dist, 70px))); }
  }
  @keyframes drift-down{
    0%,100%{ transform: var(--deco-rotate, rotate(0deg)) translateY(0); }
    50%{ transform: var(--deco-rotate, rotate(0deg)) translateY(var(--deco-dist, 70px)); }
  }
  @keyframes sway{
    0%,100%{ transform: rotate(calc(var(--deco-rotate-raw, -6deg) - 6deg)); transform-origin: bottom center; }
    50%{ transform: rotate(calc(var(--deco-rotate-raw, -6deg) + 6deg)); transform-origin: bottom center; }
  }
  @keyframes twinkle{
    0%,100%{ opacity:var(--deco-min-op,.35); }
    50%{ opacity:1; }
  }
  @keyframes rainFall{
    0%{ background-position: 0 0; }
    100%{ background-position: -60px 160px; }
  }
  @keyframes flash{
    0%,100%{ opacity:0; }
    3%,7%{ opacity:1; }
    5%{ opacity:.3; }
    10%{ opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .deco{ animation:none !important; }
    #arenaHint{ animation:none; }
  }
  #grabSvg{ position:absolute; inset:0; width:100%; height:100%; z-index:5; }
  #aimSvg{ position:absolute; inset:0; width:100%; height:100%; z-index:4; pointer-events:none; }
  #turretDecal{ position:absolute; left:50%; bottom:30px; transform:translate(-50%,0); z-index:7; pointer-events:none; font-size:22px; line-height:1; }
  #grabHub{
    position:absolute; left:50%; bottom:0; width:68px; height:34px;
    border-radius:9999px 9999px 0 0; transform:translateX(-50%);
    z-index:6; box-shadow:0 0 18px 5px rgba(251,191,36,.55); transition:box-shadow .2s ease;
  }
  #grabHub.charging{ animation:hubPulse .5s ease-in-out infinite; }
  @keyframes hubPulse{ 0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.1);} }
  #chargeBar{
    position:absolute; left:50%; bottom:38px; transform:translateX(-50%);
    width:70px; height:6px; border-radius:99px; background:rgba(255,255,255,.15); z-index:7; overflow:hidden; opacity:0; transition:opacity .15s;
  }
  #chargeBar.on{ opacity:1; }
  #chargeFill{ height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--mint)); }

  /* floating score popups */
  .pop-score{
    position:absolute; z-index:30; font-family:var(--font-body); font-weight:800; font-size:18px;
    pointer-events:none; animation:floatUp .9s ease-out forwards; text-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  @keyframes floatUp{ 0%{ transform:translate(-50%,0) scale(.7); opacity:0;} 15%{opacity:1; transform:translate(-50%,-10px) scale(1.15);} 100%{ transform:translate(-50%,-46px) scale(1); opacity:0; } }

  /* ============ WORKSHOP ============ */
  aside#workshop{
    max-height:32vh; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px;
    background:rgba(49,46,129,.6); border-top:4px solid var(--bg-panel-light);
  }
  @media (min-width:1000px){
    main{ flex-direction:row; }
    #arena{ flex-basis:70%; }
    aside#workshop{ max-height:none; flex-basis:30%; max-width:380px; border-top:none; border-left:4px solid var(--bg-panel-light); }
  }
  .topic-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:rgba(253,244,227,.5); font-weight:700; margin:0 0 2px; }
  #topicVal{ font-family:var(--font-body); font-size:clamp(18px,2.4vw,24px); color:var(--gold); margin:0; }
  #progressWrap{ height:8px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  #progressFill{ height:100%; width:0%; background:linear-gradient(90deg,var(--mint),var(--cyan)); transition:width .4s ease; border-radius:99px; }
  #wordList{ display:flex; flex-direction:column; gap:10px; }
  .word-card{ border-radius:16px; padding:12px; background:rgba(67,56,202,.4); transition:outline-color .2s, background .2s; }
  .word-card.solved{ outline:2px solid var(--mint); background:rgba(52,211,153,0.12); }
  .word-card .w-lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:rgba(253,244,227,.45); font-weight:700; margin:0 0 6px; }
  .slots{ display:flex; gap:6px; flex-wrap:wrap; }
  .word-slot{
    width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-body); font-weight:700; font-size:18px;
    background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.25); color:var(--cream);
    transition:transform .1s ease, background .2s ease;
  }
  .word-slot.filled{ background:var(--mint); color:#062018; border-color:var(--mint); cursor:default; }
  .word-slot.ghost{ color:transparent; -webkit-text-stroke:1.5px rgba(253,244,227,0.4); background:rgba(255,255,255,0.05); border-style:dashed; }
  .word-slot.locked{ opacity:.55; cursor:default; }
  .word-slot:not(.filled):not(.locked):hover{ transform:translateY(-2px); border-color:rgba(253,244,227,.6); }
  .word-slot.slot-wrong{ animation:slotFlash .4s ease; }
  @keyframes slotFlash{ 0%,100%{background:rgba(255,255,255,.06);} 50%{background:rgba(248,113,113,.55);} }
  .word-card.just-solved{ animation:cardPop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cardPop{ 0%{transform:scale(.96);} 55%{transform:scale(1.04);} 100%{transform:scale(1);} }

  /* ============ TRAY ============ */
  footer{
    background:var(--bg-panel); border-top:4px solid var(--bg-panel-light);
    padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; z-index:20;
  }
  .tray-lbl{ font-family:var(--font-body); font-size:14px; color:rgba(253,244,227,.7); flex-shrink:0; }
  #tray{ display:flex; gap:8px; flex-wrap:wrap; flex:1; }
  .tray-slot{
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-body); font-weight:700; font-size:22px; color:#1E1B4B; cursor:pointer; position:relative;
    box-shadow:0 3px 0 rgba(0,0,0,0.25); transition:transform .12s ease, box-shadow .12s ease;
  }
  .tray-slot:not(.empty):hover{ transform:translateY(-3px); }
  .tray-slot.empty{ background:rgba(255,255,255,0.06); box-shadow:none; border:2px dashed rgba(255,255,255,0.18); cursor:default; }
  .tray-slot.selected{ transform:translateY(-6px); box-shadow:0 0 0 3px var(--cream), 0 8px 0 rgba(0,0,0,0.25); }
  .tray-slot.premium{ box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(253,230,138,.7); }
  .tray-slot.just-added{ animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
  .tray-slot.junk{ outline:2px dashed rgba(248,113,113,.55); }
  @keyframes popIn{ from{transform:scale(0.6); opacity:0;} to{transform:scale(1); opacity:1;} }
  #disposeBtn{
    background:rgba(244,114,182,.8); padding:9px 14px; border-radius:12px; font-size:13px; font-weight:800; white-space:nowrap;
    transition:background .15s, opacity .15s, transform .1s;
  }
  #disposeBtn:hover{ background:#F472B6; }
  #disposeBtn:active{ transform:scale(.95); }
  #disposeBtn.warn{ background:rgba(248,113,113,.9); animation:disposePulse 1.2s ease-in-out infinite; }
  @keyframes disposePulse{ 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5);} 50%{box-shadow:0 0 0 8px rgba(248,113,113,0);} }
  #disposeBtn:disabled{ opacity:.4; cursor:default; animation:none; }

  @keyframes shake{ 10%,90%{transform:translateX(-3px);} 20%,80%{transform:translateX(5px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .shake{ animation:shake .45s; }

  /* ============ MODALS ============ */
  #modalRoot{ position:fixed; inset:0; z-index:50; pointer-events:none; }
  #modalRoot > *{ pointer-events:auto; }
  .modal-backdrop{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:rgba(15,13,45,0.82); backdrop-filter:blur(3px);
  }
  .modal{
    background:var(--bg-panel); border-radius:24px; padding:26px; max-width:400px; width:90%;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
    max-height:86vh; overflow-y:auto;
  }
  .modal h2{ font-family:var(--font-body); font-size:clamp(24px,4vw,32px); margin:0 0 6px; }
  .modal p{ color:rgba(253,244,227,.75); margin:0 0 16px; font-size:15px; line-height:1.55; }
  .modal-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .modal-stats .val{ font-family:var(--font-body); font-size:20px; }
  .modal-stats .lbl{ font-size:10px; text-transform:uppercase; color:rgba(253,244,227,.5); }
  .modal-btn{
    width:100%; padding:12px; border-radius:12px; font-family:var(--font-body); font-size:18px; font-weight:800;
    transition:transform .1s ease, filter .15s;
  }
  .modal-btn:active{ transform:scale(.96); }
  .modal-btn.primary{ background:var(--mint); color:#062018; }
  .modal-btn.amber{ background:var(--amber); color:#3a2600; }
  .modal-btn.pink{ background:#F472B6; color:#3a0a1e; }
  .modal-btn.ghostbtn{ background:rgba(255,255,255,.1); color:var(--cream); margin-top:8px; font-size:14px; padding:9px; }
  .modal-btn-row{ display:flex; gap:10px; }
  .howto{ text-align:left; font-size:14px; color:rgba(253,244,227,.75); margin:0 0 16px; padding:0; list-style:none; }
  .howto li{ margin-bottom:8px; display:flex; gap:8px; align-items:flex-start; }
  .howto .ic{ flex-shrink:0; }

  #toastRoot{ position:fixed; top:calc(64px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{
    background:rgba(30,27,75,.95); border:2px solid var(--bg-panel-light); border-radius:12px; padding:8px 16px;
    font-weight:800; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.4); animation:toastIn .25s ease, toastOut .3s ease 2s forwards;
    display:flex; gap:8px; align-items:center; white-space:nowrap;
  }
  @keyframes toastIn{ from{ transform:translateY(-12px); opacity:0; } }
  @keyframes toastOut{ to{ transform:translateY(-8px); opacity:0; } }

  ::-webkit-scrollbar{ width:8px; } ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); border-radius:8px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>

<div id="app">
  <!-- STATUS BAR -->
  <header>
    <span class="brand">🌀 Word Drift</span>
    <div class="stats">
      <div class="stat"><span class="lbl">Score</span><span id="scoreVal" class="font-display val">150</span></div>
      <div class="stat"><span class="lbl">Level</span><span id="levelVal" class="font-display val">1</span></div>
      <div class="stat"><span class="lbl">Streak x</span><span id="multVal" class="font-display val">1.0</span></div>
    </div>
    <div class="hdr-btns">
      <button id="muteBtn" class="icon-btn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button id="helpBtn" class="icon-btn" title="How to play" aria-label="How to play">❓</button>
      <button id="forfeitBtn" class="icon-btn danger" title="Restart game" aria-label="Restart game">↺</button>
    </div>
  </header>

  <!-- ARENA + WORKSHOP -->
  <main>
    <section id="arena" aria-label="Letter arena">
      <div id="bgLayer"></div>
      <div id="arenaHint">Press &amp; hold anywhere, aim with your cursor, let go to fire!</div>
      <div id="fgLayer"></div>
      <svg id="aimSvg"><line id="aimLine" x1="0" y1="0" x2="0" y2="0" stroke="#FDF4E3" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round" opacity="0"/></svg>
      <svg id="grabSvg"><polyline id="grabLine" points="" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" opacity="0"/></svg>
      <div id="grabHub" style="background:#FBBF24;"></div>
      <div id="chargeBar"><div id="chargeFill"></div></div>
      <div id="turretDecal"></div>
    </section>

    <aside id="workshop" aria-label="Word workshop">
      <div>
        <p class="topic-lbl">Topic</p>
        <h2 id="topicVal">Backyard Basics</h2>
      </div>
      <div id="progressWrap" role="progressbar" aria-label="Words solved"><div id="progressFill"></div></div>
      <div id="wordList"></div>
    </aside>
  </main>

  <!-- TRAY -->
  <footer>
    <span class="tray-lbl">Your Tray</span>
    <div id="tray"></div>
    <button id="disposeBtn">🗑️ Dispose Tray <span id="disposeCostLabel"></span></button>
  </footer>
</div>

<div id="toastRoot" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
"use strict";

/* ================= DATA ================= */
const LETTER_POINTS = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
const DISTRACTOR_SOURCE = "EARIOTNSLCUDPMHGBFYWKVXZJQ".split('');
const START_SCORE = 150;

const LEVEL_REGISTRY = Object.freeze([
  {id:1, topic:"Backyard Basics",  words:["CAT","DOG","TREE","HOSE"],        driftSpeed:34, spawnMs:1550, maxOnScreen:6,  trayOversize:2, distractorRatio:0.04, premiumChance:0},
  {id:2, topic:"Garden Friends",   words:["FROG","BEE","SNAIL"],              driftSpeed:44, spawnMs:1400, maxOnScreen:7,  trayOversize:2, distractorRatio:0.09, premiumChance:0},
  {id:3, topic:"Ocean Creatures",  words:["CRAB","FISH","SHARK","OCTOPUS"],   driftSpeed:54, spawnMs:1250, maxOnScreen:8,  trayOversize:3, distractorRatio:0.13, premiumChance:0},
  {id:4, topic:"Weather Words",    words:["CLOUD","STORM","BREEZE","RAINBOW"],driftSpeed:66, spawnMs:1100, maxOnScreen:9,  trayOversize:3, distractorRatio:0.18, premiumChance:0},
  {id:5, topic:"Space Explorers",  words:["ROCKET","PLANET","GALAXY","COMET"],driftSpeed:80, spawnMs:950,  maxOnScreen:10, trayOversize:3, distractorRatio:0.22, premiumChance:0.07},
]);
const TILE_COLORS = ["#FBBF24","#22D3EE","#F472B6","#34D399","#A78BFA","#FCA5A5"];
const GRAB_SKINS = [
  {name:"Garden Vine",    color:"#34D399", width:7, zigzag:true},
  {name:"Spider Thread",  color:"#E5E7EB", width:2, zigzag:false},
  {name:"Tentacle Reach", color:"#22D3EE", width:9, zigzag:true},
  {name:"Lightning Whip",  color:"#FBBF24", width:4, zigzag:true},
  {name:"Tractor Beam",   color:"#A78BFA", width:6, zigzag:false},
];
const CHARGE_MS = 1100;
const RETRACT_MS = 200;
const HIT_RADIUS = 34;

/* ================= LEVEL VISUALS (unchanged config contract) ================= */
const DEFAULT_VISUALS = {
  background: { css:{}, decorations:[] },
  foreground: { css:{}, decorations:[] },
  turret: {},
};
/* Generates n decorations scattered within a top/left % range — used for
   starfields, flower beds, bubbles, rain splashes etc. All values are plain
   decoration config objects, so they compose with the rest of the system. */
function scatter(n, make){
  return Array.from({length:n}, (_,i)=>{
    const cfg = make(i);
    cfg.top = `${(cfg.topMin + Math.random()*(cfg.topMax-cfg.topMin)).toFixed(1)}%`;
    cfg.left = `${(cfg.leftMin + Math.random()*(cfg.leftMax-cfg.leftMin)).toFixed(1)}%`;
    delete cfg.topMin; delete cfg.topMax; delete cfg.leftMin; delete cfg.leftMax;
    return cfg;
  });
}

const treeRows = (side) => Array.from({length:15},(_,i)=>({
  emoji:'🌳', size:100, top:`${100-i*5}%`, left: side==='r' ? '95%' : '-5%',
  opacity:1, rotate:(i%2?20:-20), zIndex:i+1,
}));
const LEVEL_VISUALS = [
  /* ============ Level 1 : Backyard Basics ============ */
  {
    background:{
      css:{
        backgroundImage:
          'radial-gradient(circle at 88% 10%, rgba(253,230,138,0.35), transparent 22%),' +
          'linear-gradient(180deg, rgba(52,211,153,0.10) 0%, rgba(30,27,75,0) 55%)',

const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderDecorations(layerEl, list){
  layerEl.querySelectorAll('.deco').forEach(el=>el.remove());
  (list||[]).forEach(d=>{
    const el = document.createElement('div');
    el.className = 'deco';
    el.textContent = d.emoji;
    el.style.fontSize = (d.size||32)+'px';
    el.style.top = d.top; el.style.left = d.left;
    el.style.opacity = d.opacity!=null ? d.opacity : 1;
    el.style.zIndex = d.zIndex!=null ? d.zIndex : '';
    const rotate = `rotate(${d.rotate||0}deg)`;
    const motionOK = !REDUCED_MOTION;
    if(d.anim==='sway'){
      el.style.setProperty('--deco-rotate-raw', `${d.rotate||0}deg`);
      el.style.setProperty('--deco-rotate', rotate);
      if(motionOK) el.style.animation = `sway ${d.duration||4}s ease-in-out infinite`;
      else el.style.transform = rotate;
    } else if(d.anim==='twinkle'){
      el.style.setProperty('--deco-min-op', d.minOpacity!=null ? d.minOpacity : 0.3);
      if(motionOK) el.style.animation = `twinkle ${d.duration||3}s ease-in-out ${d.delay||0}s infinite`;
      else el.style.opacity = 0.7;
    } else if((d.anim==='drift-right' || d.anim==='drift-left' || d.anim==='drift-up' || d.anim==='drift-down') && motionOK){
      el.style.setProperty('--deco-rotate', rotate);
      el.style.setProperty('--deco-dist', (d.distance!=null ? d.distance : 70)+'px');
      el.style.animation = `${d.anim} ${d.duration||18}s ease-in-out ${d.delay||0}s infinite`;
    } else {
      el.style.transform = rotate;
    }
    layerEl.appendChild(el);
  });
}

/* ================= AUDIO (tiny synth, no assets) ================= */
let audioCtx = null, muted = false;
function beep(freq, dur=0.09, type='sine', gain=0.12, slideTo=null){
  if(muted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime+dur);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(err){ /* audio unavailable — game continues silently */ }
}

/* ================= HELPERS ================= */
function currentLevel(){ return LEVEL_REGISTRY[state.levelIndex]; }
function trayCapacity(lvl){ return Math.max(...lvl.words.map(w=>w.length)) + lvl.trayOversize; }
function letterDemand(){
  const demand = {};
  state.words.forEach(w=>{
    if(w.solved) return;
    w.slots.forEach((s,i)=>{ if(s===null){ const L=w.word[i]; demand[L]=(demand[L]||0)+1; } });
  });
  return demand;
}
function weightedPick(map){
  const entries = Object.entries(map);
  const total = entries.reduce((a,[,v])=>a+v,0);
  let r = Math.random()*total;
  for(const [k,v] of entries){ r-=v; if(r<=0) return k; }
  return entries[entries.length-1][0];
}
function setupWordsForLevel(lvl){
  state.words = lvl.words.map(w=>{
    // Progressive ghost hiding: hide one additional slot per level beyond the
    // first (Level 1 = full hints, Level 5 = 4 slots hidden). Hidden slots are
    // chosen randomly per word and stored in state so they stay stable across
    // the frequent re-renders of the workshop.
    const hidden = new Set();
    const hideCount = Math.min(state.levelIndex, w.length);
    const indices = Array.from({length: w.length}, (_,i)=>i);
    while(hidden.size < hideCount){
      hidden.add(indices.splice(Math.floor(Math.random()*indices.length), 1)[0]);
    }
    return { word:w, slots:Array(w.length).fill(null), solved:false, hiddenSlots:hidden };
  });
}

function renderWorkshop(highlightWordIdx){
  const list = document.getElementById('wordList');
  list.innerHTML = '';
  state.words.forEach((w, wi)=>{
    const card = document.createElement('div');
    card.className = `word-card ${w.solved?'solved':''} ${wi===highlightWordIdx?'just-solved':''}`;
    const label = document.createElement('p');
    label.className = 'w-lbl';
    label.textContent = w.solved ? `✓ ${w.word}` : `${w.word.length}-letter word`;
    const slotsWrap = document.createElement('div');
    slotsWrap.className = 'slots';
    w.slots.forEach((letter, si)=>{
      const slot = document.createElement('div');
      slot.className = `word-slot ${letter?'filled':'ghost'} ${w.solved?'locked':''}`;
      // Ghost letters are progressively hidden by level via w.hiddenSlots
      const showGhost = !w.hiddenSlots || !w.hiddenSlots.has(si);
      slot.textContent = letter || (showGhost ? w.word[si] : '');
      slot.setAttribute('role','button');
      slot.setAttribute('tabindex', w.solved||letter ? '-1' : '0');
      slot.setAttribute('aria-label', letter ? `slot ${si+1}, letter ${letter}` : `empty slot ${si+1}, tap to place selected letter`);
      slot.addEventListener('pointerdown', ()=>onSlotClick(wi, si));
      slot.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onSlotClick(wi, si); } });
      slotsWrap.appendChild(slot);
    });
    card.appendChild(label);
    card.appendChild(slotsWrap);
    list.appendChild(card);
  });
}

/* ================= RENDER: TRAY ================= */
function renderTray(justAddedIdx){
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  const cap = trayCapacity(currentLevel());
  for(let i=0;i<cap;i++){
    const tile = state.tray[i];
    const slot = document.createElement('div');
    if(tile){
      slot.className = `tray-slot ${justAddedIdx===i?'just-added':''} ${state.selectedTrayIdx===i?'selected':''} ${tile.isPremium?'premium':''}`;
      slot.style.background = tile.color;
      slot.setAttribute('role','button');
      slot.setAttribute('tabindex','0');
      slot.setAttribute('aria-label', `tray letter ${tile.letter}, ${tile.points} points${tile.isPremium?', premium':''}`);
      slot.textContent = tile.letter;
      slot.addEventListener('pointerdown', ()=>onTrayClick(i));
      slot.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onTrayClick(i); } });
    } else {
      slot.className = 'tray-slot empty';
    }
    tray.appendChild(slot);
  }
  renderTrayMeta();
}
function renderTrayMeta(){
  const btn = document.getElementById('disposeBtn');
  const cap = trayCapacity(currentLevel());
  const n = state.tray.length;
  btn.disabled = n===0;
  btn.classList.toggle('warn', n>=cap-1 && n>0);
  // flag junk tiles (letters that fit no open slot)
  const demand = letterDemand();
  state.tray.forEach((t,i)=>{
    if(t && !demand[t.letter]){
      const el = document.getElementById('tray').children[i];
      if(el) el.classList.add('junk');
    }
  });
}

/* ================= ARENA / PHYSICS ================= */
function spawnTile(){
  const lvl = currentLevel();
  if(state.arenaTiles.length >= lvl.maxOnScreen) return;
  const demand = letterDemand();
  if(Object.keys(demand).length===0) return;
  let letter, isPremium=false;
  if(Math.random() < lvl.distractorRatio){
    const pool = DISTRACTOR_SOURCE.filter(l=>!demand[l]);
    letter = pool.length ? pool[Math.floor(Math.random()*pool.length)] : weightedPick(demand);
  } else {
    letter = weightedPick(demand);
    if(lvl.premiumChance>0 && Math.random()<lvl.premiumChance) isPremium=true;
  }
  const arena = document.getElementById('arena');
  const w = arena.clientWidth, h = arena.clientHeight;
  const size = 56;
  const x = Math.random()*(w-size), y = Math.random()*(h-size);
  const angle = Math.random()*Math.PI*2;
  const speed = lvl.driftSpeed;
  const tileObj = {
    id: state.nextTileId++, letter, points: LETTER_POINTS[letter]||1, isPremium,
    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    color: TILE_COLORS[Math.floor(Math.random()*TILE_COLORS.length)],
  };
  const el = document.createElement('div');
  el.className = `tile ${REDUCED_MOTION?'':'pop-in'} ${isPremium?'premium':''}`;
  el.style.background = tileObj.color;
  el.innerHTML = `${letter}<span class="pt">${tileObj.points}</span>`;
  arena.appendChild(el);
  tileObj.el = el;
  state.arenaTiles.push(tileObj);
}

function maxReachForAngle(angle, w, h, cx, cy){
  const margin = 56;
  const dx = Math.cos(angle), dy = Math.sin(angle);
  let t = Infinity;
  if(dx > 1e-4) t = Math.min(t, (w-margin-cx)/dx);
  else if(dx < -1e-4) t = Math.min(t, (margin-cx)/dx);
  if(dy < -1e-4) t = Math.min(t, (margin-cy)/dy);
  if(!isFinite(t) || t<0) t = Math.max(w,h);
  return Math.max(t, 40);
}

/* ================= GRAB STRING MECHANIC ================= */
function pointerArenaPos(e){
  const arena = document.getElementById('arena');
  const rect = arena.getBoundingClientRect();
  return {x:e.clientX-rect.left, y:e.clientY-rect.top, rect};
}
function startCharge(e){
  if(!state.running || state.grab.active) return;
  if(e.button !== undefined && e.button > 0) return;
  const arena = document.getElementById('arena');
  arena.setPointerCapture(e.pointerId);
  const {x:px, y:py, rect} = pointerArenaPos(e);
  const g = state.grab;
  g.cx = rect.width/2; g.cy = rect.height;
  g.angle = Math.atan2(Math.min(py,g.cy)-g.cy, px-g.cx);
  g.length = 0; g.active = true; g.phase = 'charging';
  g.startTime = performance.now(); g.pointerId = e.pointerId;
  document.getElementById('arenaHint').style.display = 'none';
  document.getElementById('grabHub').classList.add('charging');
  document.getElementById('chargeBar').classList.add('on');
  e.preventDefault();
}
function moveCharge(e){
  const g = state.grab;
  if(!g.active || g.phase!=='charging' || e.pointerId!==g.pointerId) return;
  const {x:px, y:py} = pointerArenaPos(e);
  g.angle = Math.atan2(Math.min(py,g.cy)-g.cy, px-g.cx);
  e.preventDefault();
}
function distToSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq>1e-6 ? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
  t = Math.max(0, Math.min(1,t));
  return {dist:Math.hypot(px-(x1+t*dx), py-(y1+t*dy)), t};
}
function findPathHit(g){
  const tipX = g.cx + Math.cos(g.angle)*g.length;
  const tipY = g.cy + Math.sin(g.angle)*g.length;
  let best=null, bestT=Infinity;
  state.arenaTiles.forEach(t=>{
    const {dist, t:frac} = distToSegment(t.x+28, t.y+28, g.cx, g.cy, tipX, tipY);
    if(dist<=HIT_RADIUS && frac<bestT){ bestT=frac; best=t; }
  });
  return best;
}
function grabTile(tileObj){
  const idx = state.arenaTiles.findIndex(t=>t.id===tileObj.id);
  if(idx===-1) return;
  const t = state.arenaTiles[idx];
  t.el.style.opacity = '0';
  t.el.style.transform += ' scale(0.35)';
  setTimeout(()=>t.el.remove(), 160);
  state.arenaTiles.splice(idx,1);
  state.tray.push({letter:t.letter, points:t.points, isPremium:t.isPremium, color:t.color});
  SFX.grab();
  floatScore(t.isPremium ? `★${t.letter}!` : `+${t.letter}`, t.isPremium ? 'var(--gold)' : 'var(--cream)', t.x+28, t.y-8);
  renderTray(state.tray.length-1);
}
function resolveHitIfAny(g){
  const hit = findPathHit(g);
  if(!hit) return false;
  const cap = trayCapacity(currentLevel());
  if(state.tray.length < cap){
    grabTile(hit);
  } else {
    const trayEl = document.getElementById('tray');
    trayEl.classList.add('shake'); setTimeout(()=>trayEl.classList.remove('shake'), 450);
    SFX.full();
    toast('Tray is full — dispose or place letters!', '🚫');
  }
  return true;
}
function finishShot(){
  const g = state.grab;
  const arena = document.getElementById('arena');
  if(g.pointerId!==null){ try{ arena.releasePointerCapture(g.pointerId); }catch(err){} }
  g.active = false;
  document.getElementById('grabHub').classList.remove('charging');
  document.getElementById('chargeBar').classList.remove('on');
  document.getElementById('chargeFill').style.width = '0%';
  document.getElementById('aimLine').setAttribute('opacity','0');
  g.phase = 'retracting'; g.retractStart = performance.now(); g.retractFrom = g.length;
}
function endCharge(e){
  const g = state.grab;
  if(!g.active || e.pointerId!==g.pointerId) return;
  SFX.fire();
  resolveHitIfAny(g);
  finishShot();
}
function cancelCharge(e){
  const g = state.grab;
  if(!g.active || e.pointerId!==g.pointerId) return;
  finishShot();
}
function straightPoints(cx,cy,angle,length){
  const x=cx+Math.cos(angle)*length, y=cy+Math.sin(angle)*length;
  return `${cx},${cy} ${x},${y}`;
}
function zigzagPoints(cx,cy,angle,length){
  const segments=6, jitter=9;
  const dx=Math.cos(angle), dy=Math.sin(angle), nx=-dy, ny=dx;
  const pts=[`${cx},${cy}`];
  for(let i=1;i<=segments;i++){
    const t=(length/segments)*i;
    const j = (i===segments) ? 0 : (Math.random()*2-1)*jitter;
    pts.push(`${cx+dx*t+nx*j},${cy+dy*t+ny*j}`);
  }
  return pts.join(' ');
}
function updateGrabVisual(){
  const g = state.grab;
  const line = document.getElementById('grabLine');
  if(g.phase==='idle'){ line.setAttribute('opacity','0'); return; }
  line.setAttribute('opacity','1');
  line.setAttribute('points', activeSkin.zigzag ? zigzagPoints(g.cx,g.cy,g.angle,g.length) : straightPoints(g.cx,g.cy,g.angle,g.length));
}
function updateAimVisual(w,h){
  const g = state.grab;
  const aim = document.getElementById('aimLine');
  if(g.phase!=='charging'){ aim.setAttribute('opacity','0'); return; }
  const len = Math.min(maxReachForAngle(g.angle, w, h, g.cx, g.cy), 260);
  const x = g.cx+Math.cos(g.angle)*len, y = g.cy+Math.sin(g.angle)*len;
  aim.setAttribute('x1', g.cx); aim.setAttribute('y1', g.cy);
  aim.setAttribute('x2', x); aim.setAttribute('y2', y);
  aim.setAttribute('opacity','0.4');
}

let lastTs = 0;
function animate(ts){
  if(!state.running) return;
  if(!lastTs) lastTs = ts;
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;
  const arena = document.getElementById('arena');
  const w = arena.clientWidth, h = arena.clientHeight, size = 56;
  state.arenaTiles.forEach(t=>{
    t.x += t.vx*dt; t.y += t.vy*dt;
    if(t.x<=0){ t.x=0; t.vx=Math.abs(t.vx); }
    if(t.x>=w-size){ t.x=w-size; t.vx=-Math.abs(t.vx); }
    if(t.y<=0){ t.y=0; t.vy=Math.abs(t.vy); }
    if(t.y>=h-size){ t.y=h-size; t.vy=-Math.abs(t.vy); }
    t.el.style.transform = `translate(${t.x}px, ${t.y}px)`;
  });
  const g = state.grab;
  if(g.phase==='charging'){
    const maxLen = maxReachForAngle(g.angle, w, h, g.cx, g.cy);
    const ratio = Math.min((ts-g.startTime)/CHARGE_MS, 1);
    g.length = maxLen * ratio;
    document.getElementById('chargeFill').style.width = (ratio*100)+'%';
    updateGrabVisual();
    updateAimVisual(w,h);
    if(resolveHitIfAny(g)){ finishShot(); }
  } else if(g.phase==='retracting'){
    const ratio = Math.min((ts-g.retractStart)/RETRACT_MS, 1);
    g.length = g.retractFrom * (1-ratio);
    updateGrabVisual();
    if(ratio>=1) g.phase = 'idle';
  }
  state.rafId = requestAnimationFrame(animate);
}

/* ================= INTERACTIONS ================= */
function onTrayClick(i){
  if(!state.tray[i]) return;
  state.selectedTrayIdx = (state.selectedTrayIdx===i) ? null : i;
  renderTray();
  beep(state.selectedTrayIdx!==null ? 500 : 350, 0.05, 'triangle', 0.06);
}
function onSlotClick(wi, si){
  const word = state.words[wi];
  if(word.solved || word.slots[si]!==null) return;
  // UX: auto-select a matching tray tile if none is selected
  if(state.selectedTrayIdx===null){
    const match = state.tray.findIndex(t=>t && t.letter===word.word[si]);
    if(match!==-1){ state.selectedTrayIdx = match; renderTray(); }
    else {
      const tray = document.getElementById('tray');
      tray.classList.add('shake'); setTimeout(()=>tray.classList.remove('shake'), 450);
      toast(`You need an "${word.word[si]}" — aim for one!`, '🎯');
      SFX.full();
      return;
    }
  }
  const tile = state.tray[state.selectedTrayIdx];
  const needed = word.word[si];
  const list = document.getElementById('wordList');
  if(tile.letter === needed){
    word.slots[si] = tile.letter;
    let pts = 10 * state.multiplier;
    if(tile.isPremium) pts *= 2;
    pts = Math.round(pts);
    state.score += pts;
    state.multiplier = Math.min(state.multiplier+0.5, 3);
    state.correct++;
    state.tray.splice(state.selectedTrayIdx,1);
    state.selectedTrayIdx = null;
    let solvedNow = false;
    if(word.slots.every(s=>s!==null)){
      word.solved = true;
      const bonus = 25*word.word.length;
      state.score += bonus;
      solvedNow = true;
      SFX.solve();
      toast(`${word.word} solved! +${bonus} bonus`, '✨');
    } else {
      SFX.correct();
    }
    bumpStat('scoreVal'); bumpStat('multVal');
    floatScore(`+${pts}`, 'var(--mint)', 60 + Math.random()*80, 70);
    renderTray(); renderWorkshop(solvedNow?wi:undefined); renderStatus();
    if(state.words.every(w=>w.solved)) return onLevelComplete();
  } else {
    state.wrong++;
    state.multiplier = 1;
    list.classList.add('shake'); setTimeout(()=>list.classList.remove('shake'), 450);
    // highlight the clicked slot so the player sees exactly where the mistake landed
    const card = list.children[wi];
    if(card){
      const slotEl = card.querySelectorAll('.word-slot')[si];
      if(slotEl){ slotEl.classList.add('slot-wrong'); setTimeout(()=>slotEl.classList.remove('slot-wrong'), 420); }
    }
    toast(`Needs "${needed}", you used "${tile.letter}"`, '❌');
    SFX.wrong();
    bumpStat('multVal');
    renderStatus();
  }
}
function onDispose(){
  if(state.tray.length===0) return;
  state.tray = [];
  state.selectedTrayIdx = null;
  const lvl = currentLevel();
  state.score = Math.max(0, state.score - disposeCost(lvl));
  state.multiplier = 1;
  SFX.dispose();
  bumpStat('scoreVal');
  renderTray(); renderStatus();
  if(state.score<=0) onGameOver();
}

/* ================= LEVEL FLOW ================= */
function startLevel(idx){
  state.levelIndex = idx;
  const lvl = currentLevel();
  setupWordsForLevel(lvl);
  state.tray = []; state.selectedTrayIdx = null;
  state.correct = 0; state.wrong = 0;
  state.levelStartTime = Date.now();
  document.getElementById('arena').querySelectorAll('.tile, .pop-score').forEach(el=>el.remove());
  state.arenaTiles = [];
  state.grab = {active:false, phase:'idle', angle:0, length:0, cx:0, cy:0, startTime:0, pointerId:null, retractStart:0, retractFrom:0};
  applyLevelVisuals(idx);
  const hint = document.getElementById('arenaHint');
  hint.style.display = 'flex';
  hint.textContent = `Press & hold, aim, let go to fire the ${GRAB_SKINS[idx] ? GRAB_SKINS[idx].name : 'string'}!`;
  renderStatus(); renderWorkshop(); renderTray();
  state.running = true;
  clearInterval(state.spawnTimer);
  state.spawnTimer = setInterval(spawnTile, lvl.spawnMs);
  cancelAnimationFrame(state.rafId); lastTs = 0;
  state.rafId = requestAnimationFrame(animate);
}
function pauseLoops(){
  state.running = false;
  clearInterval(state.spawnTimer);
  cancelAnimationFrame(state.rafId);
}
function onLevelComplete(){
  pauseLoops();
  const seconds = Math.round((Date.now()-state.levelStartTime)/1000);
  const total = state.correct+state.wrong;
  const acc = total===0 ? 100 : Math.round((state.correct/total)*100);
  const isLast = state.levelIndex === LEVEL_REGISTRY.length-1;
  showModal(`
    <div class="modal" style="border:4px solid var(--mint)">
      <h2 style="color:var(--mint)">${isLast ? "🏆 You Beat the Game!" : "🎉 Level Complete!"}</h2>
      <p>${currentLevel().topic}</p>
      <div class="modal-stats">
        <div><p class="val" style="color:var(--amber)">${state.score}</p><p class="lbl">Score</p></div>
        <div><p class="val" style="color:var(--cyan)">${seconds}s</p><p class="lbl">Time</p></div>
        <div><p class="val" style="color:var(--pink)">${acc}%</p><p class="lbl">Accuracy</p></div>
      </div>
      <button id="modalNextBtn" class="modal-btn primary">${isLast ? "Play Again" : "Next Level →"}</button>
    </div>
  `);
  document.getElementById('modalNextBtn').addEventListener('click', ()=>{
    hideModal();
    if(isLast){ state = freshState(); startLevel(0); }
    else { startLevel(state.levelIndex+1); }
  });
}
function onGameOver(){
  pauseLoops();
  showModal(`
    <div class="modal" style="border:4px solid #F9A8D4">
      <h2 style="color:#F9A8D4">💥 Game Over</h2>
      <p>You ran out of points on <b>${currentLevel().topic}</b>. Careful disposing your tray next time!</p>
      <button id="modalRestartBtn" class="modal-btn pink">Restart Game</button>
    </div>
  `);
  document.getElementById('modalRestartBtn').addEventListener('click', ()=>{
    hideModal(); state = freshState(); startLevel(0);
  });
}
function onForfeit(){
  // styled confirm instead of window.confirm
  pauseLoops();
  showModal(`
    <div class="modal" style="border:4px solid var(--amber)">
      <h2 style="color:var(--amber)">↺ Restart Game?</h2>
      <p>Score and progress will restart from Level 1.</p>
      <div class="modal-btn-row">
        <button id="cancelBtn" class="modal-btn ghostbtn" style="margin:0">Keep Playing</button>
        <button id="confirmBtn" class="modal-btn amber" style="flex:1">Restart</button>
      </div>
    </div>
  `);
  document.getElementById('cancelBtn').addEventListener('click', ()=>{ hideModal(); resumeLoops(); });
  document.getElementById('confirmBtn').addEventListener('click', ()=>{ hideModal(); state = freshState(); startLevel(0); });
}
function resumeLoops(){
  const lvl = currentLevel();
  state.running = true;
  clearInterval(state.spawnTimer);
  state.spawnTimer = setInterval(spawnTile, lvl.spawnMs);
  cancelAnimationFrame(state.rafId); lastTs = 0;
  state.rafId = requestAnimationFrame(animate);
}
function showHelp(){
  pauseLoops();
  showModal(`
    <div class="modal" style="border:4px solid var(--cyan)">
      <h2 style="color:var(--cyan)">🌀 How to Play</h2>
      <ul class="howto">
        <li><span class="ic">🎯</span><span>Press &amp; hold in the arena, aim with your cursor, release to fire the string and grab a letter.</span></li>
        <li><span class="ic">🧺</span><span>Tap a tray letter to select it, then tap an empty word slot — or just tap the slot and it auto-picks the right letter.</span></li>
        <li><span class="ic">⭐</span><span>Glowing premium tiles are worth double points. Streaks raise your multiplier up to ×3.</span></li>
        <li><span class="ic">🗑️</span><span>Useless letters are outlined in red. Dispose clears the tray for points — hit 0 and it's game over!</span></li>
      </ul>
      <button id="helpCloseBtn" class="modal-btn primary">Got it!</button>
    </div>
  `);
  document.getElementById('helpCloseBtn').addEventListener('click', ()=>{ hideModal(); resumeLoops(); });
}

/* ================= MODAL UTIL ================= */
function showModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop">${html}</div>`;
}
function hideModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ================= START SCREEN ================= */
function showStartScreen(){
  showModal(`
    <div class="modal" style="border:4px solid var(--amber)">
      <h2 style="color:var(--amber)">🌀 Word Drift</h2>
      <p>Pluck drifting letters with your grab-string, then spell the topic words to level up. Watch out for junk letters — disposing them costs points, and hitting zero ends the run!</p>
      <ul class="howto">
        <li><span class="ic">1.</span><span>Press &amp; hold in the arena, aim, release to fire.</span></li>
        <li><span class="ic">2.</span><span>Tap a word slot to place a letter — the right tray tile is auto-picked.</span></li>
        <li><span class="ic">3.</span><span>Build streaks for up to ×3 points. Avoid red-outlined junk tiles.</span></li>
      </ul>
      <button id="modalStartBtn" class="modal-btn amber">Start Game</button>
    </div>
  `);
  document.getElementById('modalStartBtn').addEventListener('click', ()=>{
    hideModal();
    state = freshState();
    startLevel(0);
  });
}

/* ================= WIRE UP ================= */
document.getElementById('disposeBtn').addEventListener('click', onDispose);
document.getElementById('forfeitBtn').addEventListener('click', onForfeit);
document.getElementById('helpBtn').addEventListener('click', ()=>{ if(state && state.running) showHelp(); else showHelp(); });
document.getElementById('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if(!muted) beep(600,0.06,'sine',0.1);
});
const arenaEl = document.getElementById('arena');
arenaEl.addEventListener('pointerdown', startCharge);
arenaEl.addEventListener('pointermove', moveCharge);
arenaEl.addEventListener('pointerup', endCharge);
arenaEl.addEventListener('pointercancel', cancelCharge);
// pause the game when the tab is hidden so timers don't pile up
document.addEventListener('visibilitychange', ()=>{
  if(!state) return;
  if(document.hidden && state.running){
    pauseLoops();
    if(!document.getElementById('modalRoot').firstChild){
      showModal(`
        <div class="modal" style="border:4px solid var(--cyan)">
          <h2 style="color:var(--cyan)">⏸ Paused</h2>
          <p>The game paused while you were away.</p>
          <button id="resumeBtn" class="modal-btn primary">Resume</button>
        </div>
      `);
      document.getElementById('resumeBtn').addEventListener('click', ()=>{ hideModal(); resumeLoops(); });
    }
  }
});
window.addEventListener('resize', ()=>{
  if(!state) return;
  const arena = document.getElementById('arena');
  const w = arena.clientWidth, h = arena.clientHeight, size=56;
  state.arenaTiles.forEach(t=>{ t.x=Math.min(t.x,w-size); t.y=Math.min(t.y,h-size); });
});

state = freshState();
showStartScreen();
</script>
