<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Drift — Spelling Arcade</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
 <title>Cloud Background</title>
  <style>
    /* Makes sure the sky fills the screen */
    body {
      background: #87CEEB; /* Sky blue */
      overflow: hidden;
      margin: 0;
      height: 100vh;
      position: relative;
    }

    /* Base class for your clouds */
    .cloud {
      display: inline-block;
      position: absolute;
      will-change: transform;
      user-select: none; /* Prevents selecting the emoji text */
    }

    /* Animation for moving Left to Right, then back */
    @keyframes driftRight {
      0% { transform: translateX(50vw); }
      50% { transform: translateX(50vw)); } 
      100% { transform: translateX(50vw); }
    }

    /* Animation for moving Right to Left, then back */
    @keyframes driftLeft {
      0% { transform: translateX(50vw); }
      50% { transform: translateX(50vw); } 
      100% { transform: translateX(50vw); }
    }

    /* Apply animations */
    .move-right { animation: driftRight 15s ease-in-out infinite; }
    .move-left { animation: driftLeft 20s ease-in-out infinite; }
  </style>
  
  <style>
  :root{
    --bg-deep:#1E1B4B; --bg-panel:#312E81; --bg-panel-light:#4338CA;
    --amber:#FBBF24; --cyan:#22D3EE; --pink:#F472B6; --mint:#34D399; --violet:#A78BFA; --gold:#FDE68A;
    --cream:#FDF4E3;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; height:100dvh; }
  body{
    height:100%; height:100dvh; min-height:480px;
    font-family:'Nunito',sans-serif; background:var(--bg-deep); color:var(--cream);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(167,139,250,0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(34,211,238,0.12), transparent 40%);
    overflow:hidden;
  }
  #app{ height:100%; }
  .font-display{font-family:'Baloo 2',cursive;}
  #arena{
    min-height:280px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 42px);
    touch-action:none;
  }
  .tile{
    position:absolute; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    border-radius:16px; font-family:'Baloo 2',cursive; font-weight:700; font-size:24px; color:#1E1B4B;
    pointer-events:none; user-select:none; box-shadow:0 4px 0 rgba(0,0,0,0.25), 0 6px 12px rgba(0,0,0,0.25);
    transition:opacity .15s ease, transform .15s ease; will-change:transform; z-index:2;
  }
  #bgLayer, #fgLayer{ position:absolute; inset:0; pointer-events:none; background-repeat:no-repeat; background-size:cover; transition:background .3s ease; }
  #bgLayer{ z-index:0; }
  #fgLayer{ z-index:3; }
  .deco{ position:absolute; pointer-events:none; user-select:none; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  #turretDecal{ position:absolute; left:50%; bottom:30px; transform:translate(-50%,0); z-index:7; pointer-events:none; font-size:22px; line-height:1; }
  .tile .pt{position:absolute; bottom:3px; right:6px; font-size:9px; font-weight:800; opacity:.7;}
  .tile.premium{box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(253,230,138,.7); animation:pulseGold 1.1s ease-in-out infinite;}
  @keyframes pulseGold{0%,100%{filter:brightness(1);}50%{filter:brightness(1.25);}}
  #grabSvg{position:absolute; inset:0; width:100%; height:100%; z-index:5;}
  #grabHub{
    position:absolute; left:50%; bottom:0; width:68px; height:34px;
    border-radius:9999px 9999px 0 0; transform:translateX(-50%);
    z-index:6; box-shadow:0 0 18px 5px rgba(251,191,36,.55);
    transition:box-shadow .2s ease;
  }
  #grabHub.charging{animation:hubPulse .5s ease-in-out infinite;}
  @keyframes hubPulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.1);}}
  .tray-slot{
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',cursive; font-weight:700; font-size:22px; color:#1E1B4B; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.25); transition:transform .12s ease;
  }
  .tray-slot.empty{background:rgba(255,255,255,0.06); box-shadow:none; border:2px dashed rgba(255,255,255,0.18); cursor:default;}
  .tray-slot.selected{transform:translateY(-6px); box-shadow:0 0 0 3px var(--cream), 0 8px 0 rgba(0,0,0,0.25);}
  .word-slot{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',cursive; font-weight:700; font-size:18px; cursor:pointer;
    background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.25); color:var(--cream);
    transition:transform .1s ease, background .2s ease;
  }
  .word-slot.filled{background:var(--mint); color:#062018; border-color:var(--mint); cursor:default;}
  .word-slot.ghost{color:transparent; -webkit-text-stroke:1.5px rgba(253,244,227,0.4); background:rgba(255,255,255,0.05); border-style:dashed;}
  .word-slot.locked{opacity:.5; cursor:default;}
  @keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(5px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
  .shake{animation:shake .45s;}
  @keyframes popIn{from{transform:scale(0.6); opacity:0;}to{transform:scale(1); opacity:1;}}
  .pop-in{animation:popIn .3s cubic-bezier(.34,1.56,.64,1);}
  .word-card.solved{outline:2px solid var(--mint); background:rgba(52,211,153,0.12);}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:8px;}
  .btn-pop:active{transform:scale(.95);}
  .modal-backdrop{background:rgba(15,13,45,0.82); backdrop-filter:blur(3px);}
  #modalRoot{pointer-events:none;}
  #modalRoot > *{pointer-events:auto;}
</style>

<body class="h-screen w-screen">

<div id="app" class="h-full w-full flex flex-col">

  <!-- ============ STATUS BAR ============ -->
  <header class="flex items-center justify-between gap-3 px-4 py-3 bg-[var(--bg-panel)] shadow-lg z-20 flex-wrap">

  <!-- ============ MAIN: ARENA + WORKSHOP ============ -->
  <main class="flex-1 min-h-0 flex flex-col lg:flex-row overflow-hidden">

      <div id="bgLayer"></div>
      <div id="arenaHint" class="absolute inset-0 flex items-center justify-center text-[var(--cream)]/30 font-display text-lg text-center px-6 pointer-events-none z-10">Press &amp; hold anywhere, aim with your cursor, let go to fire!</div>
      <div id="fgLayer"></div>

    <aside id="workshop" class="max-h-[34vh] lg:max-h-none lg:basis-[30%] lg:max-w-[380px] bg-[var(--bg-panel)]/60 overflow-y-auto p-4 flex flex-col gap-3 border-t-4 lg:border-t-0 lg:border-l-4 border-[var(--bg-panel-light)]">
      <div>
        <p class="text-[11px] uppercase tracking-wide text-[var(--cream)]/50 font-bold">Topic</p>

  <!-- ============ TRAY ============ -->
  <footer class="bg-[var(--bg-panel)] border-t-4 border-[var(--bg-panel-light)] px-4 py-3 flex items-center gap-3 flex-wrap z-20">
    <span class="font-display text-sm md:text-base text-[var(--cream)]/70 shrink-0">Your Tray</span>
    <div id="tray" class="flex gap-2 flex-wrap flex-1"></div>
    <button id="disposeBtn" class="btn-pop bg-pink-500/80 hover:bg-pink-500 transition-colors px-3 py-2 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap">🗑️ Dispose Tray <span id="disposeCostLabel"></span></button>
  </footer>
</div>

<div id="modalRoot" class="fixed inset-0 z-50"></div>

<script>

   // 1. Your updated cloud object data array
    const clouds = [
  {emoji:'☁️', className: 'cloud move-right', size:384, top:'10%',  opacity:1, rotate:0}, 
  {emoji:'☁️', className: 'cloud move-left',  size:260, top:'5%',  opacity:1, rotate:0}, 
  {emoji:'☁️', className: 'cloud move-right', size:299, top:'15%',   opacity:1, rotate:0}  
];

    // 2. Loop through each cloud and build the HTML element dynamically
    clouds.forEach(cloudData => {
      const cloudElement = document.createElement('div');
      
      // Assign the CSS classes for movement
      cloudElement.className = cloudData.className;
      
      // Inject the text content (the emoji)
      cloudElement.textContent = cloudData.emoji;
      
      // Apply the visual styles from your configuration
      cloudElement.style.fontSize = cloudData.size + 'px';
      cloudElement.style.top = cloudData.top;
      cloudElement.style.left = cloudData.left;
      cloudElement.style.opacity = cloudData.opacity;
      cloudElement.style.transform = `rotate(${cloudData.rotate}deg)`;

      // Add the fully built cloud to the webpage body
      document.body.appendChild(cloudElement);
    });
"use strict";

/* ================= DATA ================= */
const LETTER_POINTS = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
const DISTRACTOR_SOURCE = "EARIOTNSLCUDPMHGBFYWKVXZJQ".split('');
const START_SCORE = 150;

const LEVEL_REGISTRY = Object.freeze([
  {id:1, topic:"Backyard Basics",  words:["CAT","DOG","TREE"],                driftSpeed:34, spawnMs:1550, maxOnScreen:6,  trayOversize:2, distractorRatio:0.04, premiumChance:0},
  {id:2, topic:"Garden Friends",   words:["FROG","BEE","SNAIL"],              driftSpeed:44, spawnMs:1400, maxOnScreen:7,  trayOversize:2, distractorRatio:0.09, premiumChance:0},
  {id:3, topic:"Ocean Creatures",  words:["CRAB","FISH","SHARK","OCTOPUS"],   driftSpeed:54, spawnMs:1250, maxOnScreen:8,  trayOversize:3, distractorRatio:0.13, premiumChance:0},
  {id:4, topic:"Weather Words",    words:["CLOUD","STORM","BREEZE","RAINBOW"],driftSpeed:66, spawnMs:1100, maxOnScreen:9,  trayOversize:3, distractorRatio:0.18, premiumChance:0},
  {id:5, topic:"Space Explorers",  words:["ROCKET","PLANET","GALAXY","COMET"],driftSpeed:80, spawnMs:950,  maxOnScreen:10, trayOversize:3, distractorRatio:0.22, premiumChance:0.07},
]);
const TILE_COLORS = ["#FBBF24","#22D3EE","#F472B6","#34D399","#A78BFA","#FCA5A5"];
const GRAB_SKINS = [
  {name:"Garden Vine",    color:"#34D399", width:7, zigzag:true},
  {name:"Spider Thread",  color:"#E5E7EB", width:2, zigzag:false},
  {name:"Tentacle Reach", color:"#22D3EE", width:9, zigzag:true},
  {name:"Lightning Whip", color:"#FBBF24", width:4, zigzag:true},
  {name:"Tractor Beam",   color:"#A78BFA", width:6, zigzag:false},
];
const CHARGE_MS = 1100;   // time held to reach max string length
const RETRACT_MS = 200;   // string snap-back duration after firing
const HIT_RADIUS = 34;    // forgiveness radius (px) around the tile center

/* ============================================================================
   LEVEL VISUALS — "Level Manager" config for per-level art
   ----------------------------------------------------------------------------
   This is the ONLY place you need to touch to re-skin a level. Nothing in the
   game loop, spawn logic, or scoring reads level index directly for visuals —
   everything goes through applyLevelVisuals(idx) below, which reads this table.

   HOW TO ADD/EDIT A LEVEL:
   Add an entry to LEVEL_VISUALS at the same array index as that level's entry
   in LEVEL_REGISTRY (index 0 = Level 1, index 1 = Level 2, etc). Any level
   WITHOUT an entry here silently falls back to DEFAULT_VISUALS, so the game
   never breaks while a level is still undesigned — just add entries as you go.

   Required shape for each entry (all fields optional; anything you omit
   falls back to DEFAULT_VISUALS for that field):
   {
     background: {
       css: { <any CSS background-* props as camelCase JS keys> },
       decorations: [ {emoji, size, top, left, opacity, rotate}, ... ]
     },
     foreground: {                    // same shape as background
       css: { ... },
       decorations: [ ... ]
     },
     turret: {
       shape:       '9999px 9999px 0 0'   // CSS border-radius string (default = dome)
       background:  'css background value (color/gradient)',
       glow:        '#hexcolor',           // outer glow tint behind the turret
       stringColor: '#hexcolor',
       stringWidth: number,
       zigzag:      boolean,               // jagged lightning-style string vs straight
       topDecal:    'emoji'                // small cosmetic emoji perched on the turret
     }
   }

   SWAPPING IN REAL ART LATER (instead of CSS gradients / emoji):
     - background/foreground: set css.backgroundImage to a base64 data URI, e.g.
         css: { backgroundImage: "url('data:image/png;base64,iVBOR...')" }
       (must be embedded as a data URI — this file is fully self-contained and
       can't fetch outside images once published.)
     - turret: set turret.imageSrc to a data URI; applyLevelVisuals() below
       already checks for it and will use it as the turret's background-image
       in place of the flat color/gradient, no other code changes needed.

   Decoration objects (used by both background & foreground) place a single
   emoji absolutely within the layer: {emoji:'🌳', size:48, top:'8%', left:'5%',
   opacity:0.5, rotate:-8}. top/left accept any CSS length ('10%', '40px').
   ============================================================================ */

const DEFAULT_VISUALS = {
  // Neutral fallback used by any level index not defined in LEVEL_VISUALS below.
  background: { css:{}, decorations:[] },
  foreground: { css:{}, decorations:[] },
  turret: {}, // falls back entirely to that level's GRAB_SKINS entry (color/width/zigzag)
};

const LEVEL_VISUALS = [
  /* ---- Level 1 index 0 : "Backyard Basics" — fully designed, use as the template ---- */
  {
    background:{
      css:{
        backgroundImage:
          'radial-gradient(circle at 88% 10%, rgba(253,230,138,0.35), transparent 22%),' +
          'linear-gradient(180deg, rgba(52,211,153,0.10) 0%, rgba(30,27,75,0) 55%)',
      },
      decorations:[
        {emoji:'☀️', size:100, top:'6%',  left:'85%', opacity:0.8, rotate:0},
        {emoji:'☁️', size:84, top:'10%', left:'18%', opacity:0.5, rotate:0},
        {emoji:'☁️', size:26, top:'20%', left:'55%', opacity:0.35, rotate:0},
        {emoji:'🌼', size:26, top:'86%', left:'10%', opacity:0.5, rotate:-6},
        {emoji:'🌼', size:22, top:'90%', left:'78%', opacity:0.45, rotate:10},
        {emoji:'🌱', size:24, top:'92%', left:'40%', opacity:0.5, rotate:0},
      ],
    },
    foreground:{
      css:{}, // no tint/vignette for level 1 — corners only, kept purely decorative
      decorations:[
        {emoji:'🍃', size:146, top:'2%',  left:'0%',  opacity:0.35, rotate:-20},
        {emoji:'🌿', size:150, top:'8%', left:'12%', opacity:0.35, rotate:15},
        {emoji:'🌿', size:150, top:'88%', left:'92%', opacity:0.35, rotate:15},
    
      ],
    },
    turret:{
      shape:'9999px 9999px 0 0',
      background:'radial-gradient(circle at 50% 0%, #6EE7B7 0%, #059669 100%)',
      glow:'#34D399',
      stringColor:'#34D399',
      stringWidth:7,
      zigzag:false,
      topDecal:'🌱',
    },
  },
  /* ---- Level 2 index 1 : "Garden Friends" — TODO, follow the Level 1 pattern above ---- */
  // { background:{...}, foreground:{...}, turret:{...} },
  /* ---- Level 3 index 2 : "Ocean Creatures" — TODO ---- */
  // { background:{...}, foreground:{...}, turret:{...} },
  /* ---- Level 4 index 3 : "Weather Words"  — TODO ---- */
  // { background:{...}, foreground:{...}, turret:{...} },
  /* ---- Level 5 index 4 : "Space Explorers" — TODO ---- */
  // { background:{...}, foreground:{...}, turret:{...} },
];

let activeSkin = {color:'#FBBF24', width:5, zigzag:false}; // current level's string skin (read by updateGrabVisual)

function renderDecorations(layerEl, list){
  layerEl.querySelectorAll('.deco').forEach(el=>el.remove());
  (list||[]).forEach(d=>{
    const el = document.createElement('div');
    el.className = 'deco';
    el.textContent = d.emoji;
    el.style.fontSize = (d.size||32)+'px';
    el.style.top = d.top; el.style.left = d.left;
    el.style.opacity = d.opacity!=null ? d.opacity : 1;
    el.style.transform = `rotate(${d.rotate||0}deg)`;
    layerEl.appendChild(el);
  });
}

// The single entry point every level's visuals flow through. Called once from
// startLevel(idx). Nothing else in the game needs to know how a level looks.
function applyLevelVisuals(idx){
  const cfg = LEVEL_VISUALS[idx] || {};
  const bgCfg = cfg.background || DEFAULT_VISUALS.background;
  const fgCfg = cfg.foreground || DEFAULT_VISUALS.foreground;
  const turretCfg = cfg.turret || DEFAULT_VISUALS.turret;
  const fallbackSkin = GRAB_SKINS[idx]; // levels without a custom turret still get this level's shot color

  const bgLayer = document.getElementById('bgLayer');
  const fgLayer = document.getElementById('fgLayer');
  bgLayer.style.backgroundImage = '';
  Object.assign(bgLayer.style, bgCfg.css || {});
  renderDecorations(bgLayer, bgCfg.decorations);

  fgLayer.style.backgroundImage = '';
  Object.assign(fgLayer.style, fgCfg.css || {});
  renderDecorations(fgLayer, fgCfg.decorations);

  const hub = document.getElementById('grabHub');
  const line = document.getElementById('grabLine');
  const decal = document.getElementById('turretDecal');
  hub.style.borderRadius = turretCfg.shape || '9999px 9999px 0 0';
  hub.style.background = turretCfg.imageSrc
    ? `url('${turretCfg.imageSrc}') center/cover no-repeat`
    : (turretCfg.background || fallbackSkin.color);
  const glow = turretCfg.glow || turretCfg.stringColor || fallbackSkin.color;
  hub.style.boxShadow = `0 0 18px 5px ${glow}88`;
  decal.textContent = turretCfg.topDecal || '';

  activeSkin = {
    color: turretCfg.stringColor || fallbackSkin.color,
    width: turretCfg.stringWidth || fallbackSkin.width,
    zigzag: turretCfg.zigzag != null ? turretCfg.zigzag : fallbackSkin.zigzag,
  };
  line.setAttribute('stroke', activeSkin.color);
  line.setAttribute('stroke-width', activeSkin.width);
  line.setAttribute('opacity','0');
}

/* ================= STATE ================= */
let state = null;
function freshState(){
  return {
    levelIndex:0, score:START_SCORE, multiplier:1,
    words:[], tray:[], arenaTiles:[], selectedTrayIdx:null,
    correct:0, wrong:0, levelStartTime:0, running:false, nextTileId:1,
    lastSpawn:0, rafId:null, spawnTimer:null,
    grab:{active:false, phase:'idle', angle:0, length:0, cx:0, cy:0, startTime:0, pointerId:null, retractStart:0, retractFrom:0},
  };
}

/* ================= HELPERS ================= */
function currentLevel(){ return LEVEL_REGISTRY[state.levelIndex]; }
function trayCapacity(lvl){ return Math.max(...lvl.words.map(w=>w.length)) + lvl.trayOversize; }
function letterDemand(){
  // How many unfilled slots currently need each letter (guarantees solvability)
  const demand = {};
  state.words.forEach(w=>{
    if(w.solved) return;
    w.slots.forEach((s,i)=>{ if(s===null){ const L=w.word[i]; demand[L]=(demand[L]||0)+1; } });
  });
  return demand;
}
function weightedPick(map){
  const entries = Object.entries(map);
  const total = entries.reduce((a,[,v])=>a+v,0);
  let r = Math.random()*total;
  for(const [k,v] of entries){ r-=v; if(r<=0) return k; }
  return entries[entries.length-1][0];
}
function setupWordsForLevel(lvl){
  state.words = lvl.words.map(w=>({ word:w, slots:Array(w.length).fill(null), solved:false }));
}

/* ================= RENDER: STATUS ================= */
function renderStatus(){
  document.getElementById('scoreVal').textContent = state.score;
  document.getElementById('levelVal').textContent = state.levelIndex+1;
  document.getElementById('multVal').textContent = state.multiplier.toFixed(1);
  document.getElementById('topicVal').textContent = currentLevel().topic;
  const lvl = currentLevel();
  document.getElementById('disposeCostLabel').textContent = `(-${disposeCost(lvl)})`;
}
function disposeCost(lvl){ return 20 + lvl.id*5; }

/* ================= RENDER: WORKSHOP ================= */
function renderWorkshop(){
  const list = document.getElementById('wordList');
  list.innerHTML = '';
  state.words.forEach((w, wi)=>{
    const card = document.createElement('div');
    card.className = `word-card rounded-2xl p-3 bg-[var(--bg-panel-light)]/40 ${w.solved?'solved':''}`;
    const slotsWrap = document.createElement('div');
    slotsWrap.className = 'flex gap-1.5 flex-wrap';
    w.slots.forEach((letter, si)=>{
      const slot = document.createElement('div');
      slot.className = `word-slot ${letter?'filled':'ghost'} ${w.solved?'locked':''}`;
      slot.textContent = letter || w.word[si];
      slot.addEventListener('pointerdown', ()=>onSlotClick(wi, si));
      slotsWrap.appendChild(slot);
    });
    const label = document.createElement('p');
    label.className = 'text-[10px] uppercase tracking-wide text-[var(--cream)]/40 font-bold mb-1.5';
    label.textContent = w.solved ? `✓ ${w.word}` : `${w.word.length}-letter word`;
    card.appendChild(label);
    card.appendChild(slotsWrap);
    list.appendChild(card);
  });
}

/* ================= RENDER: TRAY ================= */
function renderTray(){
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  const cap = trayCapacity(currentLevel());
  for(let i=0;i<cap;i++){
    const tile = state.tray[i];
    const slot = document.createElement('div');
    if(tile){
      slot.className = `tray-slot pop-in ${state.selectedTrayIdx===i?'selected':''} ${tile.isPremium?'premium':''}`;
      slot.style.background = tile.color;
      slot.innerHTML = `${tile.letter}<span class="pt" style="position:absolute;bottom:2px;right:5px;font-size:8px;">${tile.points}</span>`;
      slot.style.position='relative';
      slot.addEventListener('pointerdown', ()=>onTrayClick(i));
    } else {
      slot.className = 'tray-slot empty';
    }
    tray.appendChild(slot);
  }
}

/* ================= ARENA / PHYSICS ================= */
function spawnTile(){
  const lvl = currentLevel();
  if(state.arenaTiles.length >= lvl.maxOnScreen) return;
  const demand = letterDemand();
  if(Object.keys(demand).length===0) return;
  let letter, isPremium=false;
  if(Math.random() < lvl.distractorRatio){
    const pool = DISTRACTOR_SOURCE.filter(l=>!demand[l]);
    letter = pool.length ? pool[Math.floor(Math.random()*pool.length)] : weightedPick(demand);
  } else {
    letter = weightedPick(demand);
    if(lvl.premiumChance>0 && Math.random()<lvl.premiumChance) isPremium=true;
  }
  const arena = document.getElementById('arena');
  const w = arena.clientWidth, h = arena.clientHeight;
  const size = 56;
  const x = Math.random()*(w-size), y = Math.random()*(h-size);
  const angle = Math.random()*Math.PI*2;
  const speed = lvl.driftSpeed;
  const tileObj = {
    id: state.nextTileId++, letter, points: LETTER_POINTS[letter]||1, isPremium,
    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    color: TILE_COLORS[Math.floor(Math.random()*TILE_COLORS.length)],
  };
  const el = document.createElement('div');
  el.className = `tile pop-in ${isPremium?'premium':''}`;
  el.style.background = tileObj.color;
  el.innerHTML = `${letter}<span class="pt">${tileObj.points}</span>`;
  arena.appendChild(el);
  tileObj.el = el;
  state.arenaTiles.push(tileObj);
}

function maxReachForAngle(angle, w, h, cx, cy){
  const margin = 56; // leave roughly one tile-width of clearance from the edge
  const dx = Math.cos(angle), dy = Math.sin(angle);
  let t = Infinity;
  if(dx > 1e-4) t = Math.min(t, (w-margin-cx)/dx);
  else if(dx < -1e-4) t = Math.min(t, (margin-cx)/dx);
  if(dy < -1e-4) t = Math.min(t, (margin-cy)/dy);
  if(!isFinite(t) || t<0) t = Math.max(w,h);
  return Math.max(t, 40);
}
/* ================= GRAB STRING MECHANIC ================= */
function pointerArenaPos(e){
  const arena = document.getElementById('arena');
  const rect = arena.getBoundingClientRect();
  return {x:e.clientX-rect.left, y:e.clientY-rect.top, rect};
}
function startCharge(e){
  if(!state.running || state.grab.active) return;
  if(e.button !== undefined && e.button > 0) return;
  const arena = document.getElementById('arena');
  arena.setPointerCapture(e.pointerId);
  const {x:px, y:py, rect} = pointerArenaPos(e);
  const g = state.grab;
  g.cx = rect.width/2; g.cy = rect.height;
  g.angle = Math.atan2(Math.min(py,g.cy)-g.cy, px-g.cx);
  g.length = 0; g.active = true; g.phase = 'charging';
  g.startTime = performance.now(); g.pointerId = e.pointerId;
  document.getElementById('arenaHint').style.display = 'none';
  document.getElementById('grabHub').classList.add('charging');
  e.preventDefault();
}
function moveCharge(e){
  const g = state.grab;
  if(!g.active || g.phase!=='charging' || e.pointerId!==g.pointerId) return;
  const {x:px, y:py} = pointerArenaPos(e);
  g.angle = Math.atan2(Math.min(py,g.cy)-g.cy, px-g.cx);
  e.preventDefault();
}
function distToSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq>1e-6 ? ((px-x1)*dx+(py-y1)*dy)/lenSq : 0;
  t = Math.max(0, Math.min(1,t));
  return {dist:Math.hypot(px-(x1+t*dx), py-(y1+t*dy)), t};
}
function findPathHit(g){
  const tipX = g.cx + Math.cos(g.angle)*g.length;
  const tipY = g.cy + Math.sin(g.angle)*g.length;
  let best=null, bestT=Infinity;
  state.arenaTiles.forEach(t=>{
    const {dist, t:frac} = distToSegment(t.x+28, t.y+28, g.cx, g.cy, tipX, tipY);
    if(dist<=HIT_RADIUS && frac<bestT){ bestT=frac; best=t; }
  });
  return best;
}
function grabTile(tileObj){
  const idx = state.arenaTiles.findIndex(t=>t.id===tileObj.id);
  if(idx===-1) return;
  const t = state.arenaTiles[idx];
  t.el.style.opacity = '0';
  t.el.style.transform += ' scale(0.35)';
  setTimeout(()=>t.el.remove(), 160);
  state.arenaTiles.splice(idx,1);
  state.tray.push({letter:t.letter, points:t.points, isPremium:t.isPremium, color:t.color});
  renderTray();
}
function resolveHitIfAny(g){
  const hit = findPathHit(g);
  if(!hit) return false;
  const cap = trayCapacity(currentLevel());
  if(state.tray.length < cap){
    grabTile(hit);
  } else {
    const trayEl = document.getElementById('tray');
    trayEl.classList.add('shake'); setTimeout(()=>trayEl.classList.remove('shake'), 450);
  }
  return true;
}
function finishShot(){
  const g = state.grab;
  const arena = document.getElementById('arena');
  if(g.pointerId!==null){ try{ arena.releasePointerCapture(g.pointerId); }catch(err){} }
  g.active = false;
  document.getElementById('grabHub').classList.remove('charging');
  g.phase = 'retracting'; g.retractStart = performance.now(); g.retractFrom = g.length;
}
function endCharge(e){
  const g = state.grab;
  if(!g.active || e.pointerId!==g.pointerId) return;
  resolveHitIfAny(g);
  finishShot();
}
function cancelCharge(e){
  const g = state.grab;
  if(!g.active || e.pointerId!==g.pointerId) return;
  finishShot();
}
function straightPoints(cx,cy,angle,length){
  const x=cx+Math.cos(angle)*length, y=cy+Math.sin(angle)*length;
  return `${cx},${cy} ${x},${y}`;
}
function zigzagPoints(cx,cy,angle,length){
  const segments=6, jitter=9;
  const dx=Math.cos(angle), dy=Math.sin(angle), nx=-dy, ny=dx;
  const pts=[`${cx},${cy}`];
  for(let i=1;i<=segments;i++){
    const t=(length/segments)*i;
    const j = (i===segments) ? 0 : (Math.random()*2-1)*jitter;
    pts.push(`${cx+dx*t+nx*j},${cy+dy*t+ny*j}`);
  }
  return pts.join(' ');
}
function updateGrabVisual(){
  const g = state.grab;
  const line = document.getElementById('grabLine');
  if(g.phase==='idle'){ line.setAttribute('opacity','0'); return; }
  line.setAttribute('opacity','1');
  line.setAttribute('points', activeSkin.zigzag ? zigzagPoints(g.cx,g.cy,g.angle,g.length) : straightPoints(g.cx,g.cy,g.angle,g.length));
}

let lastTs = 0;
function animate(ts){
  if(!state.running) return;
  if(!lastTs) lastTs = ts;
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;
  const arena = document.getElementById('arena');
  const w = arena.clientWidth, h = arena.clientHeight, size = 56;
  state.arenaTiles.forEach(t=>{
    t.x += t.vx*dt; t.y += t.vy*dt;
    if(t.x<=0){ t.x=0; t.vx=Math.abs(t.vx); }
    if(t.x>=w-size){ t.x=w-size; t.vx=-Math.abs(t.vx); }
    if(t.y<=0){ t.y=0; t.vy=Math.abs(t.vy); }
    if(t.y>=h-size){ t.y=h-size; t.vy=-Math.abs(t.vy); }
    t.el.style.transform = `translate(${t.x}px, ${t.y}px)`;
  });
  const g = state.grab;
  if(g.phase==='charging'){
    const maxLen = maxReachForAngle(g.angle, w, h, g.cx, g.cy);
    g.length = maxLen * Math.min((ts-g.startTime)/CHARGE_MS, 1);
    updateGrabVisual();
    if(resolveHitIfAny(g)){ finishShot(); }
  } else if(g.phase==='retracting'){
    const ratio = Math.min((ts-g.retractStart)/RETRACT_MS, 1);
    g.length = g.retractFrom * (1-ratio);
    updateGrabVisual();
    if(ratio>=1) g.phase = 'idle';
  }
  state.rafId = requestAnimationFrame(animate);
}

/* ================= INTERACTIONS ================= */
function onTrayClick(i){
  if(!state.tray[i]) return;
  state.selectedTrayIdx = (state.selectedTrayIdx===i) ? null : i;
  renderTray();
}
function onSlotClick(wi, si){
  const word = state.words[wi];
  if(word.solved || word.slots[si]!==null) return;
  if(state.selectedTrayIdx===null){
    const tray = document.getElementById('tray');
    tray.classList.add('shake'); setTimeout(()=>tray.classList.remove('shake'), 450);
    return;
  }
  const tile = state.tray[state.selectedTrayIdx];
  const needed = word.word[si];
  const list = document.getElementById('wordList');
  if(tile.letter === needed){
    word.slots[si] = tile.letter;
    let pts = 10 * state.multiplier;
    if(tile.isPremium) pts *= 2;
    state.score += Math.round(pts);
    state.multiplier = Math.min(state.multiplier+0.5, 3);
    state.correct++;
    state.tray.splice(state.selectedTrayIdx,1);
    state.selectedTrayIdx = null;
    if(word.slots.every(s=>s!==null)){
      word.solved = true;
      state.score += 25*word.word.length;
    }
    renderTray(); renderWorkshop(); renderStatus();
    if(state.words.every(w=>w.solved)) return onLevelComplete();
  } else {
    state.wrong++;
    state.multiplier = 1;
    list.classList.add('shake'); setTimeout(()=>list.classList.remove('shake'), 450);
    renderStatus();
  }
}
function onDispose(){
  if(state.tray.length===0) return;
  state.tray = [];
  state.selectedTrayIdx = null;
  const lvl = currentLevel();
  state.score = Math.max(0, state.score - disposeCost(lvl));
  state.multiplier = 1;
  renderTray(); renderStatus();
  if(state.score<=0) onGameOver();
}

/* ================= LEVEL FLOW ================= */
function startLevel(idx){
  state.levelIndex = idx;
  const lvl = currentLevel();
  setupWordsForLevel(lvl);
  state.tray = []; state.selectedTrayIdx = null;
  state.correct = 0; state.wrong = 0;
  state.levelStartTime = Date.now();
  document.getElementById('arena').querySelectorAll('.tile').forEach(el=>el.remove());
  state.arenaTiles = [];
  state.grab = {active:false, phase:'idle', angle:0, length:0, cx:0, cy:0, startTime:0, pointerId:null, retractStart:0, retractFrom:0};
  applyLevelVisuals(idx);
  document.getElementById('arenaHint').style.display = 'flex';
  document.getElementById('arenaHint').textContent = `Press & hold, aim, let go to fire the ${GRAB_SKINS[idx].name}!`;
  renderStatus(); renderWorkshop(); renderTray();
  state.running = true;
  clearInterval(state.spawnTimer);
  state.spawnTimer = setInterval(spawnTile, lvl.spawnMs);
  cancelAnimationFrame(state.rafId); lastTs = 0;
  state.rafId = requestAnimationFrame(animate);
}
function pauseLoops(){
  state.running = false;
  clearInterval(state.spawnTimer);
  cancelAnimationFrame(state.rafId);
}
function onLevelComplete(){
  pauseLoops();
  const seconds = Math.round((Date.now()-state.levelStartTime)/1000);
  const total = state.correct+state.wrong;
  const acc = total===0 ? 100 : Math.round((state.correct/total)*100);
  const isLast = state.levelIndex === LEVEL_REGISTRY.length-1;
  showModal(`
    <div class="pop-in bg-[var(--bg-panel)] rounded-3xl p-7 max-w-sm w-[90%] text-center shadow-2xl border-4 border-[var(--mint)]">
      <p class="font-display text-3xl text-[var(--mint)] mb-1">${isLast ? "🏆 You Beat the Game!" : "🎉 Level Complete!"}</p>
      <p class="text-[var(--cream)]/70 mb-4">${currentLevel().topic}</p>
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div><p class="font-display text-xl text-[var(--amber)]">${state.score}</p><p class="text-[10px] uppercase text-[var(--cream)]/50">Score</p></div>
        <div><p class="font-display text-xl text-[var(--cyan)]">${seconds}s</p><p class="text-[10px] uppercase text-[var(--cream)]/50">Time</p></div>
        <div><p class="font-display text-xl text-[var(--pink)]">${acc}%</p><p class="text-[10px] uppercase text-[var(--cream)]/50">Accuracy</p></div>
      </div>
      <button id="modalNextBtn" class="btn-pop w-full bg-[var(--mint)] text-[#062018] font-display text-lg py-3 rounded-xl">${isLast ? "Play Again" : "Next Level →"}</button>
    </div>
  `);
  document.getElementById('modalNextBtn').addEventListener('click', ()=>{
    hideModal();
    if(isLast){ state = freshState(); startLevel(0); }
    else { startLevel(state.levelIndex+1); }
  });
}
function onGameOver(){
  pauseLoops();
  showModal(`
    <div class="pop-in bg-[var(--bg-panel)] rounded-3xl p-7 max-w-sm w-[90%] text-center shadow-2xl border-4 border-pink-400">
      <p class="font-display text-3xl text-pink-300 mb-1">💥 Game Over</p>
      <p class="text-[var(--cream)]/70 mb-6">You ran out of points on <span class="font-bold">${currentLevel().topic}</span>. Careful disposing your tray next time!</p>
      <button id="modalRestartBtn" class="btn-pop w-full bg-pink-400 text-[#3a0a1e] font-display text-lg py-3 rounded-xl">Restart Game</button>
    </div>
  `);
  document.getElementById('modalRestartBtn').addEventListener('click', ()=>{
    hideModal(); state = freshState(); startLevel(0);
  });
}
function onForfeit(){
  if(!confirm("Reset your whole run? Score and progress will restart.")) return;
  pauseLoops();
  state = freshState();
  startLevel(0);
}

/* ================= MODAL UTIL ================= */
function showModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop w-full h-full flex items-center justify-center">${html}</div>`;
}
function hideModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ================= START SCREEN ================= */
function showStartScreen(){
  showModal(`
    <div class="pop-in bg-[var(--bg-panel)] rounded-3xl p-7 max-w-md w-[90%] text-center shadow-2xl border-4 border-[var(--amber)]">
      <p class="font-display text-3xl md:text-4xl text-[var(--amber)] mb-2">🌀 Word Drift</p>
      <p class="text-[var(--cream)]/80 mb-4">Press and hold anywhere in the arena, aim with your cursor, and let go to fire a string that plucks the nearest letter. Land it in your tray, then spell the topic words on the side to level up. Watch out for useless letters — a full tray of junk costs points to clear, and if your score hits zero, it's game over!</p>
      <button id="modalStartBtn" class="btn-pop w-full bg-[var(--amber)] text-[#3a2600] font-display text-lg py-3 rounded-xl">Start Game</button>
    </div>
  `);
  document.getElementById('modalStartBtn').addEventListener('click', ()=>{
    hideModal();
    state = freshState();
    startLevel(0);
  });
}

/* ================= WIRE UP ================= */
document.getElementById('disposeBtn').addEventListener('click', onDispose);
document.getElementById('forfeitBtn').addEventListener('click', onForfeit);
const arenaEl = document.getElementById('arena');
arenaEl.addEventListener('pointerdown', startCharge);
arenaEl.addEventListener('pointermove', moveCharge);
arenaEl.addEventListener('pointerup', endCharge);
arenaEl.addEventListener('pointercancel', cancelCharge);
window.addEventListener('resize', ()=>{
  const arena = document.getElementById('arena');
  const w = arena.clientWidth, h = arena.clientHeight, size=56;
  if(!state) return;
  state.arenaTiles.forEach(t=>{ t.x=Math.min(t.x,w-size); t.y=Math.min(t.y,h-size); });
});

state = freshState();
showStartScreen();
</script>
